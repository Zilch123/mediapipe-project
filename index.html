<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Projects</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Hand Projects</h1>
    <p class="subtitle">Pick a project.</p>

    <!-- Add a button here for each new app in apps/. -->
    <div id="projects">
      <a class="project" href="apps/hand-detection/">
        <strong>Hand Detection</strong>
        <span>Live webcam preview with the landmark overlay.</span>
      </a>
      <a class="project" href="apps/violin/">
        <strong>Air Violin</strong>
        <span>Move your bow hand to play "He's a Pirate".</span>
      </a>
      <a class="project" href="apps/theremin/">
        <strong>Theremin</strong>
        <span>One continuous tone: right hand pitch, left hand volume.</span>
      </a>
      <a class="project" href="apps/painting/">
        <strong>Hand Painting</strong>
        <span>Paint with a fingertip — one colour per finger.</span>
      </a>
    </div>
  </body>
</html>
